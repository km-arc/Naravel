# Dependabot proposes version bumps as pull requests; it never merges anything. Every one of them is a dependency change, so the
# owner reviews it like any other (AGENTS.md rule 8) and CI is the check. It only updates packages and actions that are already in
# the repository, it adds none.
#
# Not covered on purpose: the service images in ci.yml and docker-compose.yml. They are exact versions that `check-image-pins.py`
# guards, and a bump is made deliberately in its own change (see .github/BRANCH-PROTECTION.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for the routine minor and patch updates; a major update arrives alone so it can be judged alone.
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    ignore:
      # Deliberate exceptions recorded in Directory.Packages.props and AGENTS.md rule 8.
      # FluentAssertions 8.x and later need a paid commercial licence, so the tests stay on 7.x. The rule is a major-update ignore and
      # not a `versions` entry on purpose: for NuGet, `versions` takes NuGet's own pattern (`7.*`), not a comparison like ">=8", and a
      # pattern that does not parse would leave 8.x proposable. The repository is on 7.2.2, so every 8.x or later is a major update.
      - dependency-name: FluentAssertions
        update-types: [ "version-update:semver-major" ]
      - dependency-name: xunit
        update-types: [ "version-update:semver-major" ]   # the move to xunit.v3 is a migration of every test project (AUDIT D-65)
      - dependency-name: SQLitePCLRaw.lib.e_sqlite3
        update-types: [ "version-update:semver-major" ]   # 3.x is a different major that Microsoft.Data.Sqlite 10 does not use
      # The packages released with .NET follow the target framework. A new major is a decision to move to the next .NET, not a bump.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: [ "version-update:semver-major" ]
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: [ "version-update:semver-major" ]
