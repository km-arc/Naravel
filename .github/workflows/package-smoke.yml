name: Package smoke (published version)

# Manual and report-only: installs the packages published on nuget.org at the given version into a consumer outside the repository,
# builds it, loads every Naravel assembly and runs the smoke program against them (.github/scripts/consumer-smoke.py). Run it after a
# release to see what a user gets; the same script runs against the freshly packed files in ci.yml before anything is pushed. With
# `templates` it also installs the published Naravel.Templates pack, generates the default application from it and builds that
# (.github/scripts/template-smoke.py --nuget); the full template smoke, with every option and the run, is in ci.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify, for example 0.2.0
        required: true
        type: string
      exclude:
        description: >-
          Comma-separated package ids that are not part of that version, for example Naravel.Routing.Cache for 0.1.1, which was
          released before that package was added. Leave empty for a version that has every package.
        required: false
        default: ''
        type: string
      templates:
        description: >-
          Also verify the Naravel.Templates pack at that version: install it, generate the default application and build it. Leave it off
          for a version that was released before the pack existed.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Install and run ${{ inputs.version }} from nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Consumer smoke
        env:
          VERSION: ${{ inputs.version }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          args=()
          IFS=',' read -ra requested <<< "$EXCLUDE"
          for id in "${requested[@]}"; do
            id="${id//[[:space:]]/}"
            if [ -n "$id" ]; then
              args+=(--exclude "$id")
            fi
          done
          python3 .github/scripts/consumer-smoke.py --nuget "$VERSION" "${args[@]}"

      - name: Template smoke (the published Naravel.Templates)
        if: ${{ !cancelled() && inputs.templates }}
        env:
          VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/template-smoke.py --nuget "$VERSION"
