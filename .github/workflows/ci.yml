name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly safety net (PDR-022 A6): the whole workflow runs on main, so a new NuGet advisory or a dialect broken by a
    # change that the PR path filter skipped shows up the next morning instead of in somebody's PR.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run of the same PR. Runs on main, tags and the schedule are never cancelled
# (a cancelled tag run would block publishing).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore Naravel.slnx 2>&1 | tee restore.log; then
            # The raw log is not readable without authentication; surface the real cause as check annotations.
            grep -E "error|NU[0-9]{4}" restore.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error title=restore::${line:0:900}"
            done
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Naravel.slnx -c Release --no-restore 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          # GitHub shows only ten annotations per step, so put every distinct compiler error into ONE annotation.
          if [ -f build.log ]; then
            summary=$(grep -E ': error [A-Z]+[0-9]+' build.log | sed -E 's# \[/[^]]*\]$##; s#^/[^ ]*/(src|tests)/#\1/#' | sort -u | head -400 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$summary" ]; then echo "::error title=Build errors::$summary"; fi
          fi

      - name: Test projects and collect coverage
        shell: bash
        run: |
          set -euo pipefail
          for project in tests/*/*.csproj; do
            project_name="$(basename "$project" .csproj)"
            results_dir="TestResults/$project_name"
            dotnet test "$project" -c Release --no-build --no-restore \
              --logger "trx;LogFileName=$project_name.trx" \
              --results-directory "$results_dir" \
              --collect:"XPlat Code Coverage"
          done

      - name: Annotate failed tests
        if: failure()
        shell: bash
        run: |
          # Surface each failed test as a check-run annotation (name, message, first stack frames) so the failure is
          # readable from the checks UI/API without opening the raw log.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          shown = 0
          for result in sorted(Path("TestResults").rglob("*.trx")):
              root = ET.parse(result).getroot()
              for node in root.iter():
                  if not node.tag.endswith("UnitTestResult") or node.attrib.get("outcome") != "Failed":
                      continue
                  message = next((n.text or "" for n in node.iter() if n.tag.endswith("}Message") or n.tag == "Message"), "")
                  stack = next((n.text or "" for n in node.iter() if n.tag.endswith("StackTrace")), "")
                  frames = "\n".join(stack.strip().splitlines()[:6])
                  body = (message.strip() + "\n" + frames)[:1500]
                  print(f"::error title=Failed test ({result.parent.parent.name}): {esc(node.attrib.get('testName', '?'))}::{esc(body)}")
                  shown += 1
                  if shown >= 10:
                      raise SystemExit(0)
          PY

      - name: Summarize test results by project
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          print("### Test results by project")
          print("| Project | Total | Passed | Failed | Skipped |")
          print("| --- | ---: | ---: | ---: | ---: |")
          results = sorted(Path("TestResults").rglob("*.trx"))
          if not results:
              print("| No TRX results found | - | - | - | - |")
          for result in results:
              relative = result.relative_to("TestResults")
              project = relative.parts[0]
              root = ET.parse(result).getroot()
              counters = next((node for node in root.iter() if node.tag.endswith("Counters")), None)
              if counters is None:
                  print(f"| {project} | unavailable | - | - | - |")
                  continue
              values = counters.attrib
              skipped = int(values.get("notExecuted", "0")) + int(values.get("notRunnable", "0"))
              print(f"| {project} | {values.get('total', '0')} | {values.get('passed', '0')} | {values.get('failed', '0')} | {skipped} |")
          PY

      - name: Report executed and skipped tests
        if: always()
        shell: bash
        run: python3 .github/scripts/test-report.py "Unit tests (${{ matrix.os }})" TestResults >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Audit vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet list Naravel.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then echo "::error::Vulnerable packages found"; exit 1; fi

      - name: Pack every packable project (package validation on)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Naravel.slnx -c Release --no-build -o ./nupkgs-check

  services:
    name: Provider integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1.3
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: naravel
          RABBITMQ_DEFAULT_PASS: naravel
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      memcached:
        image: memcached:1.6.39
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/11211' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/9092' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NARAVEL_TEST_REDIS: localhost:6379
      NARAVEL_TEST_RABBITMQ: amqp://naravel:naravel@localhost:5672/%2f
      NARAVEL_TEST_KAFKA: localhost:9092
      NARAVEL_TEST_MEMCACHED: localhost:11211
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore Naravel.slnx 2>&1 | tee restore.log; then
            # The raw log is not readable without authentication; surface the real cause as check annotations.
            grep -E "error|NU[0-9]{4}" restore.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error title=restore::${line:0:900}"
            done
            exit 1
          fi

      - name: Build
        run: dotnet build Naravel.slnx -c Release --no-restore

      - name: Provider integration tests
        run: >-
          dotnet test tests/Naravel.Queue.Providers.Tests/Naravel.Queue.Providers.Tests.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=QueueProviders.trx"
          --results-directory TestResults/Providers/Queue
          --collect:"XPlat Code Coverage"

      - name: Cache provider integration tests
        run: >-
          dotnet test tests/Naravel.Cache.Tests/Naravel.Cache.Tests.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=CacheProviders.trx"
          --results-directory TestResults/Providers/Cache
          --collect:"XPlat Code Coverage"

      - name: Broadcasting presence on Redis
        run: >-
          dotnet test tests/Naravel.Broadcasting.Tests/Naravel.Broadcasting.Tests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~PresenceRedisTests"
          --logger "trx;LogFileName=BroadcastingPresence.trx"
          --results-directory TestResults/Providers/Broadcasting
          --collect:"XPlat Code Coverage"

      - name: Annotate failed provider tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Surface failing test names and messages as workflow annotations so they are
          # readable from the run's check annotations without downloading job logs.
          for result in sorted(Path("TestResults/Providers").rglob("*.trx")):
              root = ET.parse(result).getroot()
              for node in root.iter():
                  if not node.tag.endswith("UnitTestResult") or node.attrib.get("outcome") != "Failed":
                      continue
                  message = next((n.text or "" for n in node.iter() if n.tag.endswith("Message")), "")
                  trace = next((n.text or "" for n in node.iter() if n.tag.endswith("StackTrace")), "")
                  frames = [line.strip() for line in trace.splitlines() if ".cs:line" in line]
                  text = message + " | " + " <- ".join(frames[:3]) if frames else message
                  text = " ".join(text.split())[:900].replace("%", "%25")
                  print(f"::error title=Failed: {node.attrib.get('testName', '?')}::{text}")
          PY

      - name: Summarize env-gated provider tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          print("### Env-gated provider integration results")
          print("| Suite | Total | Passed | Failed | Skipped |")
          print("| --- | ---: | ---: | ---: | ---: |")
          results = sorted(Path("TestResults/Providers").rglob("*.trx"))
          if not results:
              print("| No provider TRX results found | - | - | - | - |")
          for result in results:
              suite = result.relative_to("TestResults/Providers").parts[0]
              root = ET.parse(result).getroot()
              counters = next((node for node in root.iter() if node.tag.endswith("Counters")), None)
              if counters is None:
                  print(f"| {suite} | unavailable | - | - | - |")
                  continue
              values = counters.attrib
              skipped = int(values.get("notExecuted", "0")) + int(values.get("notRunnable", "0"))
              print(f"| {suite} | {values.get('total', '0')} | {values.get('passed', '0')} | {values.get('failed', '0')} | {skipped} |")
          PY

      - name: Report executed and skipped tests
        if: always()
        shell: bash
        run: python3 .github/scripts/test-report.py "Provider integration tests" TestResults/Providers >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload provider test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-test-and-coverage
          path: |
            TestResults/Providers/**/*.trx
            TestResults/Providers/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Audit vulnerable packages
        run: dotnet list Naravel.slnx package --vulnerable --include-transitive

  changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the database job must run
        id: filter
        shell: bash
        run: |
          # Pushes to main, tags, the nightly schedule and manual runs always run the database job. A pull request runs it
          # only when it touches the database code, its tests, shared test code, package versions, or this pipeline.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if grep -Eq '^(src/Naravel\.Database|tests/Naravel\.Database|src/Naravel\.Foundation/|tests/Shared/|Directory\.(Packages|Build)\.props|docker-compose\.yml|\.github/workflows/)' <<< "$changed"; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  database:
    name: Database (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            trait: MySql
            env_name: NARAVEL_TEST_MYSQL
            conn: 'Server=127.0.0.1;Port=3306;Database=naravel;User ID=root;Password=naravel;AllowPublicKeyRetrieval=true'
          - db: postgres
            trait: Postgres
            env_name: NARAVEL_TEST_POSTGRES
            conn: 'Host=127.0.0.1;Port=5432;Database=naravel;Username=postgres;Password=naravel'
          - db: sqlserver
            trait: SqlServer
            env_name: NARAVEL_TEST_SQLSERVER
            conn: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Naravel_Passw0rd!;TrustServerCertificate=true;Encrypt=false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The container starts first, in the background, so it initialises while .NET is restored and built.
      - name: Start the ${{ matrix.db }} container
        shell: bash
        run: |
          echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          case "${{ matrix.db }}" in
            mysql)
              # tmpfs data and relaxed flushing: this is a throwaway test database.
              docker run -d --name naravel-db -p 3306:3306 --tmpfs /var/lib/mysql:rw \
                -e MYSQL_ROOT_PASSWORD=naravel -e MYSQL_DATABASE=naravel \
                mysql:8.4.6 --skip-log-bin --innodb-flush-log-at-trx-commit=2
              ;;
            postgres)
              docker run -d --name naravel-db -p 5432:5432 --tmpfs /var/lib/postgresql/data:rw \
                -e POSTGRES_PASSWORD=naravel -e POSTGRES_DB=naravel \
                postgres:17.6-alpine -c fsync=off -c synchronous_commit=off -c full_page_writes=off
              ;;
            sqlserver)
              # SQL Server cannot be tuned much; this leg sets the wall time of the job.
              docker run -d --name naravel-db -p 1433:1433 \
                -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=Naravel_Passw0rd!' -e MSSQL_PID=Developer \
                mcr.microsoft.com/mssql/server:2022-CU19-ubuntu-22.04
              ;;
          esac

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet restore tests/Naravel.Database.Tests/Naravel.Database.Tests.csproj 2>&1 | tee restore.log; then
            grep -E "error|NU[0-9]{4}" restore.log | sort -u | head -15 | while IFS= read -r line; do
              echo "::error title=restore::${line:0:900}"
            done
            exit 1
          fi

      - name: Build
        run: dotnet build tests/Naravel.Database.Tests/Naravel.Database.Tests.csproj -c Release --no-restore

      - name: Wait for the ${{ matrix.db }} server
        shell: bash
        run: |
          ready() {
            case "${{ matrix.db }}" in
              mysql) docker exec naravel-db mysqladmin ping -h 127.0.0.1 -uroot -pnaravel --silent >/dev/null 2>&1 ;;
              postgres) docker exec naravel-db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 ;;
              sqlserver) docker logs naravel-db 2>&1 | grep -q "SQL Server is now ready for client connections" ;;
            esac
          }
          for attempt in $(seq 1 90); do
            if ready; then
              echo "Server ready after about $(( $(date +%s) - STARTED_AT )) s since the container started."
              exit 0
            fi
            sleep 2
          done
          echo "::error title=database container::${{ matrix.db }} did not become ready within 180 s"
          docker logs naravel-db 2>&1 | tail -40
          exit 1

      - name: Contract tests (${{ matrix.db }})
        shell: bash
        env:
          CONNECTION: ${{ matrix.conn }}
        run: |
          export "${{ matrix.env_name }}=$CONNECTION"
          dotnet test tests/Naravel.Database.Tests/Naravel.Database.Tests.csproj -c Release --no-build --no-restore \
            --filter "Dialect=${{ matrix.trait }}" \
            --logger "trx;LogFileName=Database-${{ matrix.db }}.trx" \
            --results-directory "TestResults/Database/${{ matrix.db }}"

      # A skipped test is reported as success by dotnet test, so a missing connection string would otherwise pass silently.
      - name: Require that the ${{ matrix.db }} tests really ran
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          passed = 0
          skipped = 0
          for result in Path("TestResults/Database/${{ matrix.db }}").rglob("*.trx"):
              root = ET.parse(result).getroot()
              counters = next((n for n in root.iter() if n.tag.endswith("Counters")), None)
              if counters is not None:
                  passed += int(counters.attrib.get("passed", "0"))
                  skipped += int(counters.attrib.get("notExecuted", "0")) + int(counters.attrib.get("notRunnable", "0"))
          print(f"passed={passed} skipped={skipped}")
          if passed < 1 or skipped:
              print(f"::error title=NOT RUN::the ${{ matrix.db }} tests were skipped or none matched the Dialect trait (passed={passed}, skipped={skipped})")
              raise SystemExit(1)
          PY

      - name: Report executed and skipped tests
        if: always()
        shell: bash
        run: python3 .github/scripts/test-report.py "Database (${{ matrix.db }})" "TestResults/Database/${{ matrix.db }}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Annotate failed tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def esc(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          shown = 0
          for result in sorted(Path("TestResults/Database").rglob("*.trx")):
              root = ET.parse(result).getroot()
              for node in root.iter():
                  if not node.tag.endswith("UnitTestResult") or node.attrib.get("outcome") != "Failed":
                      continue
                  message = next((n.text or "" for n in node.iter() if n.tag.endswith("Message")), "")
                  stack = next((n.text or "" for n in node.iter() if n.tag.endswith("StackTrace")), "")
                  frames = "\n".join(stack.strip().splitlines()[:6])
                  print(f"::error title=Failed test (${{ matrix.db }}): {esc(node.attrib.get('testName', '?'))}::{esc((message.strip() + chr(10) + frames)[:1500])}")
                  shown += 1
                  if shown >= 10:
                      raise SystemExit(0)
          PY
          docker logs naravel-db 2>&1 | tail -30 || true

      - name: Job timing
        if: always()
        shell: bash
        run: |
          echo "Database (${{ matrix.db }}): $(( $(date +%s) - STARTED_AT )) s from container start to here (PDR-022 A6 budget: 300 s, then shard by trait)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-tests-${{ matrix.db }}
          path: TestResults/Database/**/*.trx
          if-no-files-found: warn

  # Service images must be exact versions: a floating tag can turn a green main red with no code change.
  pins:
    name: Service image pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject floating image tags
        run: python3 .github/scripts/check-image-pins.py
      - name: Publishing must wait for every required job
        run: python3 .github/scripts/check-publish-gates.py

  # The one check branch protection needs. A database job skipped by the path filter counts as success; any failure,
  # cancellation or missing result fails it, so a filtered job can never block a merge by being absent.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fast, services, changes, database, pins]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os

          needs = json.loads(os.environ["NEEDS"])
          bad = []
          for name, info in needs.items():
              result = info["result"]
              allowed = {"success", "skipped"} if name == "database" else {"success"}
              print(f"{name}: {result}")
              if result not in allowed:
                  bad.append(f"{name} ({result})")
          if needs["database"]["result"] == "skipped" and needs["changes"]["result"] == "success":
              print("database job skipped by the path filter (no database changes)")
          if bad:
              print("::error title=ci-ok::not successful: " + ", ".join(bad))
              raise SystemExit(1)
          PY

  publish:
    name: Publish to NuGet
    # Publishing waits for every job ci-ok requires, the service image pins included. ci-ok is listed as well, so a job added to it
    # later is covered even if this list is forgotten; .github/scripts/check-publish-gates.py fails the build when the two drift apart.
    needs: [fast, services, changes, database, pins, ci-ok]
    # Publish only from version tags (v*). Never from main, PRs or manual runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The repository owner configures required reviewers on this environment.
    environment: nuget-release
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet Trusted Publishing; granted to this job only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack projects
        run: dotnet pack Naravel.slnx -c Release -o ./nupkgs

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # NuGet.org profile name that owns the trusted-publishing policy.
          # Configured by the owner as a repository/environment variable (not a secret).
          user: ${{ vars.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate