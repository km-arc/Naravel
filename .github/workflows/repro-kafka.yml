name: Kafka contract reproduction

on:
  push:
    branches:
      - 'fix/K1-**'

permissions:
  contents: read

jobs:
  kafka-repro:
    name: Kafka provider repetitions
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 1
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/9092' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NARAVEL_TEST_KAFKA: localhost:9092
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build solution once
        run: |
          dotnet restore Naravel.slnx
          dotnet build Naravel.slnx --no-restore

      - name: Run Kafka provider tests ten times
        shell: bash
        run: |
          set -uo pipefail
          passed=0
          failed=0

          for iteration in $(seq 1 10); do
            echo "::group::Kafka provider run ${iteration}/10"
            if dotnet test tests/Naravel.Queue.Providers.Tests --no-build --filter "FullyQualifiedName~Kafka" --logger "console;verbosity=detailed"; then
              passed=$((passed + 1))
              echo "Run ${iteration}: PASS"
            else
              failed=$((failed + 1))
              echo "Run ${iteration}: FAIL"
            fi
            echo "::endgroup::"
          done

          echo "Kafka provider repetitions: ${passed}/10 passed; ${failed}/10 failed."
          {
            echo "### Kafka provider repetitions"
            echo "| Passed | Failed |"
            echo "| ---: | ---: |"
            echo "| ${passed} | ${failed} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            exit 1
          fi