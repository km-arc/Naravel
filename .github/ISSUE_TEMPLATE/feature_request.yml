name: Feature request
description: Propose a Laravel-style feature, or an improvement to an existing package.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Naravel ports the *ideas* of Laravel, not every API. A new Laravel equivalent needs a PDR (Parity Decision Record) before code,
        and a large one needs owner approval, so please open an issue first and wait for a reply before sending a pull request.
        English or Persian is fine. See [CONTRIBUTING.md](https://github.com/km-arc/Naravel/blob/main/CONTRIBUTING.md).
  - type: input
    id: laravel
    attributes:
      label: The Laravel feature, if there is one
      description: The Laravel API or documentation page this comes from.
      placeholder: "Cache::flexible(), Queue::failing(), ..."
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why it is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: native
    attributes:
      label: What .NET already offers
      description: Rule zero is to use the native .NET solution when it is idiomatic. What did you try, and why is it not enough?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: The call site you would like to write, ideally three lines of user code or fewer.
      render: csharp
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Whether this changes an existing package or needs a new one. Name the package in the problem description.
      multiple: true
      options:
        - An existing package
        - A new package
        - Documentation only
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, and what each would cost.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this myself (a PDR first, then code and tests).
